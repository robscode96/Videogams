<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Speed Rush</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Courier New', monospace;
      overflow: hidden;
    }
    #gameCanvas {
      display: block;
      image-rendering: pixelated;
      border: 2px solid #222;
    }
    #controls {
      margin-top: 8px;
      color: #555;
      font-size: 12px;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <div id="controls">ARROWS / WASD to drive &nbsp;|&nbsp; ENTER to start</div>
  <script src="game.js"></script>
</body>
</html>
